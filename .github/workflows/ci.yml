name: verify

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: teleprompt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEPROMPT_REAL_DOCX: test/fixtures/public/dwi-privacy-notice.docx
      TELEPROMPT_REAL_PDF: test/fixtures/public/us-constitution.pdf
      TELEPROMPT_REAL_LEGACY_PROFILE: test/fixtures/public/legacy-1.0.3
      TELEPROMPT_REAL_LEGACY_STATE: test/fixtures/public/legacy-0.1.0/teleprompt-state.json
      TELEPROMPT_E2E_EXECUTABLE: release/linux-unpacked/teleprompt
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          package-manager-cache: false

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip xdotool x11-utils libgtk-3-0 libnss3 libxss1 libxtst6 libasound2t64 libgbm1 libdrm2 libatspi2.0-0

      - name: Install locked dependencies
        run: npm ci

      - name: Provision locked Electron runtime
        run: |
          node node_modules/electron/install.js
          node -p 'require("electron")'

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build and verify packaged app
        run: npm run package:dir

      - name: Configure per-executable Chromium namespace sandbox
        run: |
          packaged_executable="$(realpath release/linux-unpacked/teleprompt)"
          development_executable="$(node -p 'require("electron")')"
          # Permit user namespaces only for the two tested executables. Keep the
          # runner-wide AppArmor restriction and Chromium seccomp sandbox enabled.
          # https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
          cat > "$RUNNER_TEMP/teleprompt-ci.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile teleprompt-ci-packaged "$packaged_executable" flags=(unconfined) {
            userns,
          }
          profile teleprompt-ci-development "$development_executable" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/teleprompt-ci.apparmor"
          test "$(stat -c '%a' release/linux-unpacked/chrome-sandbox)" = "755"
          test "$(stat -c '%a' "$(dirname "$development_executable")/chrome-sandbox")" = "755"

      - name: Record verified build identity
        run: |
          mkdir -p test-results
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          const asar = await readFile('release/linux-unpacked/resources/app.asar')
          await writeFile('test-results/build-identity.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            asarSha256: createHash('sha256').update(asar).digest('hex'),
            asarBytes: asar.length,
          }, null, 2) + '\n')
          NODE

      - name: Packaged runtime and native crash capture
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/packaged.json
        run: npm run test:e2e -- --retries=0 --reporter=json --output=test-results/runtime

      - name: Select genuine Crashpad input from this run
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile, readdir } from 'node:fs/promises'
          import { resolve, dirname } from 'node:path'
          const root = resolve('test-results/runtime')
          const files = await readdir(root, { recursive: true })
          const path = files.find(file => file.endsWith('/crash-corpus/provenance.json'))
          if (!path) throw new Error('Native tests produced no captured Crashpad corpus')
          const manifest = resolve(root, path)
          const captured = JSON.parse(await readFile(manifest, 'utf8'))
          for (const extension of ['.dmp', '.meta']) {
            if (!captured.artifacts.some(file => file.name.endsWith(extension))) {
              throw new Error(`Native corpus is missing ${extension} artifacts`)
            }
          }
          await appendFile(process.env.GITHUB_ENV, `TELEPROMPT_REAL_CRASH_CORPUS=${dirname(manifest)}\n`)
          NODE

      - name: Reviewed real-input unit gate
        run: npm run test:real -- --reporter=json --outputFile=test-results/reviewed-units.json

      - name: Require reviewed real-input release qualification
        run: node scripts/check-release-qualification.mjs

      - name: Full unit and coverage gates
        run: npm run test:coverage

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teleprompt-verification-${{ github.sha }}
          path: |
            test-results/build-identity.json
            test-results/packaged.json
            test-results/reviewed-units.json
            coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: warn

      - name: Build distributable formats
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm run package
          cd release
          sha256sum Teleprompt-*.AppImage teleprompt_*.deb teleprompt-*.tar.gz > SHA256SUMS.txt

      - name: Upload verified unpacked application
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: teleprompt-linux-x64-${{ github.sha }}
          path: release/linux-unpacked
          retention-days: 7
          if-no-files-found: error

      - name: Upload tagged release candidates
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: teleprompt-${{ github.ref_name }}-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
